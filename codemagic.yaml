# CI/CD do Desmalha no Codemagic.
#
# Sem assinatura, sem publicação, sem variáveis secretas por enquanto — release
# signing será Play App Signing + variáveis cifradas do Codemagic, configuradas
# pelo usuário na interface web (nunca no repositório).
#
# A conexão da conta Codemagic a este repositório é feita na interface web.
# O disparo automático por push depende do webhook do repositório no GitHub,
# criado pelo botão "Update webhook" na aba Webhooks do app no Codemagic.
workflows:
  android-verify:
    name: Android verify (analyze + testes + APK debug)
    # mac_mini_m2 é o ÚNICO instance type do plano gratuito do Codemagic —
    # linux_x2/linux_x4/windows_x2 exigem billing habilitado. Logo, este workflow
    # também consome a cota mensal de 500 min (M2); cancel_previous_builds e o
    # max_build_duration curto existem para proteger essa cota.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      # 'flutter: fvm' faz o Codemagic ler o .fvmrc da raiz e apontar o comando
      # `flutter` para a versão pinada (3.44.7). O CLI `fvm` NÃO existe no PATH
      # dos runners — os scripts chamam `flutter`/`dart` diretamente.
      flutter: fvm
      java: 17
    triggering:
      # Critério de disparo (24/09/2026, decisão do owner): por TAG, não por
      # push no main. O M2 do plano gratuito é a cota única de 500 min/mês, e
      # um build por merge gastava ~12 min por card — numa sequência de cards
      # isso come a cota que o iOS também usa. Cada branch já passa, na
      # própria sessão, por analyze + testes + `flutter build apk --debug`
      # antes do merge; o Codemagic vira a verificação consolidada, disparada
      # de propósito:
      #
      #     git tag verificar-<slug> origin/main
      #     git push origin verificar-<slug>
      #
      # Sem `when: changeset`: tag é intenção explícita, e a comparação de
      # changeset num evento de tag não é contra o merge anterior.
      events:
        - tag
      tag_patterns:
        - pattern: 'verificar-*'
          include: true
      cancel_previous_builds: true
    # Cache de dependências para poupar a cota única de 500 min/mês do M2:
    # evita re-baixar pacotes pub e artefatos do Gradle a cada build.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Flutter pinado (sanidade)
        script: |
          flutter --version
          flutter --version | grep -q "Flutter 3\.44\.7" \
            || { echo "ERRO: versão do Flutter difere do .fvmrc (esperado 3.44.7)"; exit 1; }
      - name: Analyze do app
        working_directory: apps/desmalha_app
        script: |
          flutter pub get
          flutter analyze
      - name: Testes do desmalha_core (Dart puro)
        working_directory: packages/desmalha_core
        script: |
          dart pub get
          dart test
      - name: Testes do app
        working_directory: apps/desmalha_app
        script: |
          flutter test
      - name: Build APK debug
        working_directory: apps/desmalha_app
        script: |
          flutter build apk --debug
    artifacts:
      - apps/desmalha_app/build/app/outputs/flutter-apk/app-debug.apk

  ios-simulator-nightly:
    name: iOS simulator nightly (compila sem assinar)
    # O agendamento (cron) é configurado na interface web do Codemagic
    # (Scheduled builds) apontando para este workflow; o YAML não carrega cron.
    # Cadência: 3x/semana (seg/qua/sex, 01:00 UTC, main). A condição de
    # ago/2026 ("volta a diário quando o SQLCipher entrar") foi atingida em
    # 17/ago/2026, mas o usuário decidiu na mesma data MANTER 3x/semana para
    # preservar a cota única de 500 min/mês. Revisitar se o iOS quebrar entre
    # nightlies com frequência. Disparo manual: "Start new build".
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: fvm
      xcode: latest
    # Mesma economia de cota do android-verify; CocoaPods entra porque o build
    # iOS resolve pods na primeira compilação com plugins nativos.
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Flutter pinado (sanidade)
        script: |
          flutter --version
          flutter --version | grep -q "Flutter 3\.44\.7" \
            || { echo "ERRO: versão do Flutter difere do .fvmrc (esperado 3.44.7)"; exit 1; }
      - name: Build iOS para simulador (sem codesign)
        working_directory: apps/desmalha_app
        script: |
          flutter pub get
          flutter build ios --simulator --no-codesign
      # TODO(Fase 4): quando existir código de banco (SQLite/Drift + SQLCipher),
      # acrescentar aqui os testes de `PRAGMA cipher_version` e o round-trip de
      # backup cifrado ponta-a-ponta no simulador.
