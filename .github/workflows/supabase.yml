# Desmalha — verificação e publicação do backend Supabase.
#
# POR QUE AQUI, E NÃO NO CODEMAGIC
#
# O plano gratuito do Codemagic só oferece `mac_mini_m2`, e TODOS os builds
# dividem uma cota única de 500 min/mês — que existe para o Flutter e para o
# simulador iOS, as duas coisas que só um runner macOS faz. Publicar migrations
# não precisa de macOS. Um runner Linux do GitHub Actions custa 1x (contra os
# 10x do macOS lá) e não encosta na cota que o iOS depende.
#
# O QUE ISTO SUBSTITUI
#
# Três passos que eram manuais, repetidos à mão em cada projeto:
#   • `psql -f supabase/manual/chave_hmac_aceites.sql`
#   • habilitar pg_cron na interface + `psql -f .../agendamento_expurgo.sql`
#   • configurar OTP de 8 dígitos, 600s, secure email change, templates com
#     {{ .Token }} e "nenhum provedor social" na interface de Authentication
#
# Passo manual repetido à mão é passo que diverge entre dev e prod sem ninguém
# perceber — e, no caso do agendamento, prazo de retenção que depende de alguém
# lembrar não é prazo, é intenção.
#
# ⚠️ NADA É PUBLICADO SEM PASSAR PELO PORTÃO. O job `verificar` roda as duas
# suítes antes; `publicar` depende dele. Publicar migration não verificada seria
# automatizar o erro em vez do trabalho.

name: Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'tool/testar_supabase.sh'
      - 'tool/testar_edge.sh'
      # O catálogo versionado é servido pelo backend; mudar conteúdo ou o
      # publicador precisa republicar — é o caminho "corrigir banco sem
      # release" existindo de verdade.
      - 'tool/publicar_catalogo.ts'
      - 'packages/desmalha_core/catalogo/**'
      - 'packages/desmalha_core/perfis/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'tool/testar_supabase.sh'
      - 'tool/testar_edge.sh'
      - 'tool/publicar_catalogo.ts'
      - 'packages/desmalha_core/catalogo/**'
      - 'packages/desmalha_core/perfis/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Projeto alvo da publicação'
        type: choice
        options: [DEV, PROD]
        default: DEV

jobs:
  verificar:
    name: Suítes do backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge functions (type-check + testes)
        run: ./tool/testar_edge.sh

      - name: Schema e conformidade num Postgres limpo
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create database desmalha'
          # Responde "as migrations do repositório reproduzem o schema sozinhas?"
          # — pergunta que aplicar migration por migration na nuvem não responde,
          # porque lá o estado já existe.
          ./tool/testar_supabase.sh --descartavel \
            'postgresql://postgres:postgres@localhost:5432/desmalha'

      - name: Catálogo — publica e confere num Postgres limpo
        # O mesmo par de SQLs que o job `publicar` roda na nuvem, exercitado
        # aqui contra o banco que a suíte acabou de migrar. Prova que o SQL
        # gerado EXECUTA e que a conferência fecha — antes de existir
        # qualquer credencial envolvida.
        env:
          PGPASSWORD: postgres
          URL: postgresql://postgres:postgres@localhost:5432/desmalha
        run: |
          deno run --allow-read tool/publicar_catalogo.ts --sql-publicar > /tmp/catalogo_publicar.sql
          deno run --allow-read tool/publicar_catalogo.ts --sql-conferir > /tmp/catalogo_conferir.sql
          psql "$URL" -v ON_ERROR_STOP=1 -q -f /tmp/catalogo_publicar.sql
          psql "$URL" -v ON_ERROR_STOP=1 -q -f /tmp/catalogo_conferir.sql

  publicar:
    name: Publicar no ${{ inputs.ambiente || 'DEV' }}
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Dev e prod são separados por SUFIXO no nome do segredo, e não por
    # Environment do GitHub. Motivo: **no plano Free, repositório privado não
    # pode configurar Environments** — e este repositório é privado. Sufixo
    # funciona em qualquer plano.
    #
    # Se um dia houver GitHub Pro/Team, dá para migrar para Environments e
    # ganhar o portão de aprovação obrigatória antes de tocar em produção. Por
    # ora, o que segura produção é ela só existir por disparo manual: push no
    # `main` publica exclusivamente no DEV.
    env:
      AMB: ${{ inputs.ambiente || 'DEV' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets[format('SUPABASE_DB_PASSWORD_{0}', inputs.ambiente || 'DEV')] }}
      SUPABASE_DB_URL: ${{ secrets[format('SUPABASE_DB_URL_{0}', inputs.ambiente || 'DEV')] }}
      # Estes dois não são segredo — o ref e a URL do projeto são públicos, e
      # como `vars` aparecem legíveis no log, o que ajuda a depurar. Mas aceitam
      # `secrets` também: a distinção entre as duas abas do GitHub é sutil, e na
      # primeira configuração real os cinco valores foram parar em Secrets.
      # Exigir que fossem movidos seria transformar um detalhe de interface em
      # trabalho manual — exatamente o que este workflow existe para eliminar.
      # Em `secrets`, só saem mascarados como *** no log.
      SUPABASE_SITE_URL: ${{ vars[format('SUPABASE_SITE_URL_{0}', inputs.ambiente || 'DEV')] || secrets[format('SUPABASE_SITE_URL_{0}', inputs.ambiente || 'DEV')] }}
      # SMTP próprio. Os nomes são os que o config.toml consome em env(...).
      SUPABASE_AUTH_SMTP_PASS: ${{ secrets[format('RESEND_API_KEY_{0}', inputs.ambiente || 'DEV')] }}
      SUPABASE_AUTH_SMTP_ADMIN_EMAIL: ${{ vars[format('SMTP_ADMIN_EMAIL_{0}', inputs.ambiente || 'DEV')] || secrets[format('SMTP_ADMIN_EMAIL_{0}', inputs.ambiente || 'DEV')] }}
      REF: ${{ vars[format('SUPABASE_PROJECT_REF_{0}', inputs.ambiente || 'DEV')] || secrets[format('SUPABASE_PROJECT_REF_{0}', inputs.ambiente || 'DEV')] }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Para montar o payload de auth a partir do config.toml.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Conferir que o ambiente está configurado
        # Falhar aqui, com o nome do que falta, é muito melhor do que falhar no
        # meio da publicação com uma mensagem do CLI sobre credencial ausente.
        run: |
          faltando=()
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || faltando+=("secret   SUPABASE_ACCESS_TOKEN")
          [[ -n "$SUPABASE_DB_URL" ]]       || faltando+=("secret   SUPABASE_DB_URL_$AMB")
          [[ -n "$SUPABASE_DB_PASSWORD" ]]  || faltando+=("secret   SUPABASE_DB_PASSWORD_$AMB")
          [[ -n "$REF" ]]                   || faltando+=("SUPABASE_PROJECT_REF_$AMB   (variable ou secret)")
          [[ -n "$SUPABASE_SITE_URL" ]]     || faltando+=("SUPABASE_SITE_URL_$AMB   (variable ou secret)")
          # Sem SMTP, `config push` recusa os templates e o login nao existe:
          # o template padrao manda link, e a tela pede 8 digitos. Faltar aqui
          # e melhor do que empurrar SMTP vazio e derrubar o envio de e-mail.
          [[ -n "$SUPABASE_AUTH_SMTP_PASS" ]]        || faltando+=("secret   RESEND_API_KEY_$AMB")
          [[ -n "$SUPABASE_AUTH_SMTP_ADMIN_EMAIL" ]] || faltando+=("SMTP_ADMIN_EMAIL_$AMB   (variable ou secret)")
          if (( ${#faltando[@]} )); then
            printf 'ambiente %s incompleto — falta cadastrar em\n' "$AMB"
            printf 'Settings > Secrets and variables > Actions:\n\n'
            printf '  %s\n' "${faltando[@]}"
            printf '\nroteiro completo em supabase/operacao/publicacao.md\n'
            exit 1
          fi

          # A string de conexão errada custou uma execução inteira: o CLI
          # conecta, o DNS devolve IPv6, e o erro é um ECONNREFUSED com um
          # endereço hexadecimal que não menciona IPv6 nem pooler em lugar
          # nenhum. Conferir o FORMATO aqui transforma isso numa mensagem que
          # diz o que fazer, cinco segundos depois do início.
          #
          # Não valida a senha nem o host exato — só a classe de endereço, que é
          # a única coisa que dá para saber sem conectar.
          if [[ "$SUPABASE_DB_URL" == *"@db."*".supabase.co"* ]]; then
            cat >&2 <<'FIM'
          SUPABASE_DB_URL está com a string de "Direct connection".

          Ela não funciona aqui: é IPv6 no plano free, e o runner do GitHub
          Actions só fala IPv4. O sintoma seria um ECONNREFUSED para um
          endereço 2600:... no passo de Migrations.

          Use a string de "Session pooler" (porta 5432):
            postgresql://postgres.<ref>:<senha>@aws-<regiao>.pooler.supabase.com:5432/postgres

          No dashboard: botão Connect, no topo do projeto, aba Session pooler.
          FIM
            exit 1
          fi

          if [[ "$SUPABASE_DB_URL" == *".pooler.supabase.com:6543"* ]]; then
            cat >&2 <<'FIM'
          SUPABASE_DB_URL está com a string de "Transaction pooler" (porta 6543).

          Ela não suporta prepared statements, e as migrations usam. Troque a
          porta para 5432 — é a mesma string, em modo Session pooler.
          FIM
            exit 1
          fi

      - name: Migrations
        # 🔴 SUPABASE_DB_URL tem de ser a string do **Session pooler** (porta
        # 5432, host aws-<regiao>.pooler.supabase.com). A conexao direta
        # (db.<ref>.supabase.co) e IPv6 no plano free, e o GitHub Actions so
        # fala IPv4 — dali ela nao resolve, e o sintoma e um timeout que nao
        # menciona IPv6. O Transaction pooler (6543) tambem nao serve: nao
        # suporta prepared statements, e migrations usam.
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Pós-deploy (Vault e agendamento do expurgo)
        # Depois das migrations, sempre: são idempotentes e dependem da
        # plataforma (Vault, pg_cron), por isso não são migration. Sem eles,
        # `registrar_aceite` falha no primeiro aceite e os prazos da PP v0.2
        # ficam só no texto.
        run: |
          for f in supabase/pos_deploy/*.sql; do
            echo "→ $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Catálogo versionado
        # Sincroniza repo → banco e LÊ DE VOLTA numa conexão separada, depois
        # do commit. "O psql saiu com 0" diz que o pedido foi aceito, não que
        # o projeto ficou como se queria — a lição do SMTP vale aqui também.
        run: |
          deno run --allow-read tool/publicar_catalogo.ts --sql-publicar > /tmp/catalogo_publicar.sql
          deno run --allow-read tool/publicar_catalogo.ts --sql-conferir > /tmp/catalogo_conferir.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/catalogo_publicar.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/catalogo_conferir.sql
          echo "catálogo publicado e conferido:"
          psql "$SUPABASE_DB_URL" -At -c \
            "select tipo || '/' || id || '  (' || publicado_em::date || ')'
               from public.catalogo_itens order by tipo, id"

      - name: Configuração de Auth
        # Escreve só os campos nomeados em tool/auth_para_api.ts. Ver o
        # comentário longo mais abaixo sobre por que `config push` não serve.
        run: |
          # --yes porque `config push` abre um prompt de confirmação. Numa
          # execução anterior ele foi aceito por EOF, o que funciona por
          # acidente: depender de como o CLI trata entrada fechada é frágil
          # entre versões, e o modo de falhar seria o job pendurado.
          # ─── SMTP: o workflow CONFERE, e nunca escreve ─────────────────
          #
          # 🔴 A versão anterior fazia PATCH nos campos smtp_* pela Management
          # API, e isso DESLIGAVA o SMTP do projeto. Medido em 17/ago/2026: às
          # 04:39 um e-mail saiu pelo Resend, às 04:42 este workflow rodou, e o
          # "Enable custom SMTP" do painel voltou a desligado. A habilitação
          # mora fora do que a API expõe — a especificação OpenAPI oficial não
          # tem campo para ela —, e reescrever os sete valores a derruba junto.
          #
          # Automação que destrói configuração que funciona é pior do que não
          # ter automação. Então o passo deixou de mutar e passou a verificar:
          # lê o que está no projeto e reprova se não for o esperado. A garantia
          # de que dev e prod não divergem continua de pé; o que sai é a
          # escrita, que era o que quebrava.
          #
          # Ligar o SMTP virou passo de UMA VEZ por projeto, no painel. Está no
          # roteiro em supabase/operacao/autenticacao.md.
          leia() {
            python3 -c "import tomllib,sys; print(tomllib.load(open('supabase/config.toml','rb'))['auth']['email']['smtp'][sys.argv[1]])" "$1"
          }
          esperado_host=$(leia host)

          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.json

          atual_host=$(jq -r '.smtp_host // ""' /tmp/auth.json)
          tem_senha=$(jq -r '((.smtp_pass // "") | length) > 0' /tmp/auth.json)

          echo "→ SMTP do projeto: host=${atual_host:-(vazio)} senha=$tem_senha"

          if [[ "$atual_host" != "$esperado_host" || "$tem_senha" != "true" ]]; then
            cat >&2 <<FIM
          O projeto $AMB não está com o SMTP próprio configurado.

          esperado: host=$esperado_host, com senha
          no projeto: host=${atual_host:-(vazio)}, senha preenchida=$tem_senha

          Sem SMTP próprio o Supabase IGNORA os templates personalizados, e o
          e-mail sai com o template padrão em inglês, com link em vez dos 8
          dígitos que a tela do app pede — ou seja, ninguém entra.

          Ligue uma vez, no painel do projeto:
            Authentication > Emails > SMTP Settings > Enable custom SMTP

          Os valores estão em supabase/operacao/autenticacao.md. Este workflow
          NÃO liga por você de propósito: escrever esses campos pela API desliga
          a habilitação, que é um estado que a API não expõe.
          FIM
            exit 1
          fi

          # ─── Resto da configuração de Auth: PATCH estreito ─────────────
          #
          # 🔴 NÃO usar `supabase config push` aqui. Ele manda a configuração de
          # auth INTEIRA, e os campos que o config.toml não descreve vão embora
          # junto — inclusive o SMTP remoto, porque o bloco [auth.email.smtp] de
          # lá vale para o stack local. Medido em 17/ago/2026: às 04:56 a
          # conferência acima leu smtp_host=smtp.resend.com, o config push rodou
          # no mesmo job logo depois, e o toggle voltou a desligado.
          #
          # Não é bug do CLI: é o que "push da configuração inteira" significa, e
          # é incompatível com um projeto onde parte da configuração só existe
          # no painel. Então escrevemos só os campos que nomeamos.
          #
          # A lista está em tool/auth_para_api.ts, com teste que reprova se um
          # campo smtp_* entrar nela.
          corpo=$(deno run --allow-read tool/auth_para_api.ts)

          codigo=$(curl -sS -o /tmp/patch.json -w '%{http_code}'             -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$corpo")
          if [[ "$codigo" != 2?? ]]; then
            echo "a Management API recusou a configuração de auth (HTTP $codigo):" >&2
            cat /tmp/patch.json >&2
            exit 1
          fi

          # Lê de volta o que importa: que o SMTP SOBREVIVEU ao PATCH — que é o
          # defeito que este desenho existe para não repetir — e que o template
          # aplicado é o nosso, e não o padrão em inglês.
          curl -sS "https://api.supabase.com/v1/projects/$REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/depois.json

          depois_host=$(jq -r '.smtp_host // ""' /tmp/depois.json)
          tem_token=$(jq -r '(.mailer_templates_magic_link_content // "") | contains("{{ .Token }}")' /tmp/depois.json)
          echo "→ depois do PATCH: smtp_host=${depois_host:-(vazio)} template_com_token=$tem_token"

          if [[ "$depois_host" != "$esperado_host" ]]; then
            echo "o PATCH derrubou o SMTP do projeto — era exatamente o que se queria evitar" >&2
            exit 1
          fi
          if [[ "$tem_token" != "true" ]]; then
            echo "o template aplicado não contém {{ .Token }}: o e-mail vai sair com link" >&2
            exit 1
          fi

      - name: Edge functions
        run: supabase functions deploy excluir-conta --project-ref "$REF"

      - name: Conferir o que ficou de pé
        # Publicação que reporta sucesso sem olhar o resultado é a mesma classe
        # de erro que a guia de DARF com código de barras adivinhado.
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'chave HMAC: ' ||
                 case when exists (select 1 from vault.secrets
                                    where name = 'desmalha_aceites_hmac_key')
                      then 'presente' else 'AUSENTE' end;
          select 'job ' || jobname || ': ' || schedule ||
                 case when active then '' else ' (INATIVO)' end
            from cron.job where jobname like 'desmalha-%' order by jobname;
          SQL
          echo "função publicada:"
          supabase functions list --project-ref "$REF"
